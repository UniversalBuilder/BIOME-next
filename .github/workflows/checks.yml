name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem src/biome/*.ps1 | ForEach-Object {
            $parseTokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors)
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - run: python -m pip install -r src/biome/requirements-build.txt
      - run: python -m unittest discover -s src/biome -p 'test_*.py'
      - run: node src/biome/test_project_sort.js
      - run: node src/biome/test_entry_upload.js
      - run: python tools/render_guides.py
